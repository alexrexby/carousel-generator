services:
  carousel-generator:
    build: .
    container_name: carousel-generator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:8007"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-karusel_a3a266badc2f91c609cfaac6}
    volumes:
      - ./output:/app/output
      - ./config:/app/config
      - ./decks:/app/decks
      - ./assets:/app/assets
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
